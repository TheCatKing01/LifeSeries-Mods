pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven { url = "https://maven.kikugie.dev/releases"}
		// https://maven.kikugie.dev/releases
		// https://maven.kikugie.dev/snapshots
		mavenCentral()
		gradlePluginPortal()
	}
}

plugins {
	id "dev.kikugie.stonecutter" version "0.9"
	// https://maven.kikugie.dev/#/releases/dev/kikugie/stonecutter
	// https://maven.kikugie.dev/#/snapshots/dev/kikugie/stonecutter
}

def allVersionsEnabled = (gradle.startParameter.projectProperties["allVersions"] ?: "false").toString().toBoolean()
if (!allVersionsEnabled) {
	def defaultVersionProject = "1.21.11"
	def defaultScopedTasks = [
		"clean",
		"build",
		"assemble",
		"check",
		"test",
		"runClient",
		"runClientNamed"
	] as Set
	def rewritten = gradle.startParameter.taskNames.collect { taskName ->
		if (!taskName.contains(":") && defaultScopedTasks.contains(taskName)) {
			return ":${defaultVersionProject}:${taskName}".toString()
		}
		return taskName.toString()
	}
	gradle.startParameter.setTaskNames(rewritten)
}

stonecutter {
	create(getRootProject()) {
		versions "1.20", "1.20.2", "1.20.3", "1.20.5", "1.21", "1.21.2", "1.21.4", "1.21.5", "1.21.6", "1.21.9", "1.21.11"
		version('26.1', '26.1').buildscript 'build-noremap.gradle'
		version('26.2', '26.2').buildscript 'build-noremap.gradle'
		vcsVersion = "1.21"
	}
}
